name: Pull Request Checks

on:
  pull_request:
    branches: [ main, development ]

env:
  GO_VERSION: '1.24.3'

jobs:
  # Quick PR validation - faster than full CI
  validate:
    name: Quick Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check go.mod and go.sum
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Please run 'go fmt ./...'"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  # Quick tests without database
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          go test -v -short -race ./...

  # Build check
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build application
        run: |
          go build -v -o main .
          ./main --version || echo "Build successful"

  # Summary
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, build-check]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.validate.result }}" == "success" ] && \
             [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.build-check.result }}" == "success" ]; then
            echo "✅ All PR checks passed!"
            echo "Ready for review 🎉"
          else
            echo "❌ Some checks failed"
            echo "Validation: ${{ needs.validate.result }}"
            echo "Tests: ${{ needs.unit-tests.result }}"
            echo "Build: ${{ needs.build-check.result }}"
            exit 1
          fi

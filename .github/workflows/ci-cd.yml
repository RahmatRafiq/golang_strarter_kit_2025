name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.24.3'
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/golang-starter-kit-2025

jobs:
  # Job 1: Testing & Linting
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Create test .env files
        run: |
          # Create .env for general use with SQLite (fast, no services needed)
          cat > .env << 'EOF'
          APP_NAME="Test App"
          APP_ENV=testing
          APP_PORT=9999
          JWT_SECRET_KEY=test_secret_key_at_least_32_characters_long
          JWT_EXPIRE_MINUTES=60
          SKIP_AUTH=true
          DB_CONNECTION=sqlite
          EOF
          
          # Create .env.test for Ginkgo tests (controllers, helpers)
          cp .env .env.test
          
          # Create .env.testing for integration/unit tests
          cp .env .env.testing

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Generate test report
        if: always()
        run: |
          go test -json ./... > test-report.json || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-report.json

  # Job 2: Deployment Notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ Tests passed successfully!"
            echo "All checks completed"
          else
            echo "❌ Tests failed!"
            exit 1
          fi

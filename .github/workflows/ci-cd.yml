  # Summary job (no longer needs build/deploy)
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()

    steps:
      - name: Check pipeline status
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ CI Pipeline completed successfully!"
            echo "✅ Tests passed"
            echo "✅ Linting passed"
            echo ""
            echo "ℹ️  Docker build and deployment are disabled"
            echo "ℹ️  Enable them by uncommenting the jobs in .github/workflows/ci-cd.yml"
          else
            echo "❌ Pipeline failed!"
            echo "Test: ${{ needs.test.result }}"
            exit 1
          fi

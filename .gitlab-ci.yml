image: golang:1.24.3-alpine

stages:
  - test
  - build
  - deploy
  - security

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_DRIVER: overlay2
  GO111MODULE: "on"
  CGO_ENABLED: "0"

# Cache untuk mempercepat build
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .go/pkg/mod/

before_script:
  - apk add --no-cache git make gcc musl-dev
  - export GOPATH=$CI_PROJECT_DIR/.go
  - export PATH=$GOPATH/bin:$PATH

# ==========================================
# Stage 1: Testing & Linting
# ==========================================

test:unit:
  stage: test
  services:
    - name: mysql:8.0
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: test_password
        MYSQL_DATABASE: test_db
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_PASSWORD: test_password
        POSTGRES_DB: test_db
  variables:
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    MYSQL_DB: test_db
    MYSQL_USER: root
    MYSQL_PASSWORD: test_password
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: test_password
  before_script:
    - apk add --no-cache git make gcc musl-dev mysql-client postgresql-client
    - export GOPATH=$CI_PROJECT_DIR/.go
    - export PATH=$GOPATH/bin:$PATH
    # Wait for databases to be ready
    - until mysqladmin ping -h mysql -P 3306 -u root -ptest_password --silent; do echo 'waiting for mysql...'; sleep 2; done
    - until pg_isready -h postgres -p 5432 -U postgres; do echo 'waiting for postgres...'; sleep 2; done
  script:
    - go mod download
    - go mod verify
    # Create test .env
    - |
      cat > .env << EOF
      APP_NAME="Test App"
      APP_ENV=testing
      APP_PORT=9999
      JWT_SECRET_KEY=test_secret_key_at_least_32_characters_long
      JWT_EXPIRE_MINUTES=60
      SKIP_AUTH=true
      DB_CONNECTION=mysql
      MYSQL_HOST=mysql
      MYSQL_PORT=3306
      MYSQL_DB=test_db
      MYSQL_USER=root
      MYSQL_PASSWORD=test_password
      POSTGRES_HOST=postgres
      POSTGRES_PORT=5432
      POSTGRES_DB=test_db
      POSTGRES_USER=postgres
      POSTGRES_PASSWORD=test_password
      EOF
    - go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.out
    expire_in: 1 week

lint:
  stage: test
  script:
    - go mod download
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run --timeout=5m
  allow_failure: true

# ==========================================
# Stage 2: Build Docker Image
# ==========================================

build:docker:
  stage: build
  image: docker:24-alpine
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache git
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA $DOCKER_IMAGE:latest
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE:latest
  only:
    - main
    - develop
  tags:
    - docker

# ==========================================
# Stage 3: Deploy
# ==========================================

deploy:dockerhub:
  stage: deploy
  image: docker:24-alpine
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache git
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - echo "✅ Docker image deployed successfully!"
    - echo "Image: $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "Latest: $DOCKER_IMAGE:latest"
  only:
    - main
  when: on_success
  dependencies:
    - build:docker


# ==========================================
# Stage 4: Security Scanning
# ==========================================

security:trivy:
  stage: security
  image: aquasec/trivy:latest
  before_script:
    - export TRIVY_CACHE_DIR=$CI_PROJECT_DIR/.trivycache/
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $DOCKER_IMAGE:latest
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  only:
    - main
  allow_failure: true
  dependencies:
    - build:docker

# ==========================================
# Additional Jobs
# ==========================================

# Check code formatting
format:check:
  stage: test
  script:
    - go fmt ./...
    - |
      if [ -n "$(git status --porcelain)" ]; then
        echo "Code is not formatted. Please run 'go fmt ./...'"
        exit 1
      fi
  allow_failure: true

# Dependency vulnerability check
security:deps:
  stage: security
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...
  allow_failure: true
  only:
    - main
    - develop

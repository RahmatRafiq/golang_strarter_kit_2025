      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.ResponseParams-any'
      summary: Logout
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: API untuk refresh token menggunakan refresh token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true

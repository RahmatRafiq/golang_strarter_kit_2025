    type: object
  requests.ResetPasswordRequest:
    properties:
      new_password:
        example: newSecurePassword123
        minLength: 8
        type: string
      token:
        example: a1b2c3d4...
        maxLength: 64
        minLength: 64
        type: string
    required:
    - new_password
    - token
    type: object
  requests.RoleRequestPut:
    properties:
      group:
        example: User
        type: string
      id:
        type: integer
      name:
        example: Admin
        type: string
    required:
    - group
    - name
    type: object
info:
  contact: {}
paths:
  /:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: Hello World
          schema:
            type: string
      summary: Show a hello world message
      tags:
      - root
  /api/database/health:
    get:
      description: Perform a health check on all configured database connections
      produces:
      - application/json
      responses:
        "200":
          description: Health check results
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Database health check
      tags:
      - Database
  /api/database/status:
    get:
      description: Get the status and statistics of all configured database connections
      produces:
      - application/json
      responses:
        "200":
          description: Connection status and statistics
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get database connection status
      tags:
      - Database
  /api/database/test:
    get:
      description: Test a specific database connection by name
      parameters:
      - description: Connection name (mysql, postgres, mysql_secondary)
        in: query
        name: connection
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Connection test result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Test database connection
      tags:
      - Database
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send password reset email to user
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reset email sent successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Request password reset
      tags:
      - auth
  /api/v1/auth/github:
    get:
      description: Redirects user to GitHub OAuth2 authorization page
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to GitHub OAuth
          schema:
            type: string
      summary: Login with GitHub OAuth2
      tags:
      - OAuth
  /api/v1/auth/google:
    get:
      description: Redirects user to Google OAuth2 consent page
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to Google OAuth
          schema:
            type: string
      summary: Login with Google OAuth2
      tags:
      - OAuth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password using valid reset token
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/requests.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or token
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Reset password with token
      tags:
      - auth
  /api/v1/storage/{filename}:
    delete:
      description: Delete a file from S3/MinIO storage
      parameters:
      - description: Filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete file from storage
      tags:
      - Storage
  /api/v1/storage/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload a file to S3/MinIO storage
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - default: general
        description: Upload folder
        in: formData
        name: folder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Upload file to storage
      tags:
      - Storage
  /api/v1/storage/url/{filename}:
    get:
      description: Get a temporary presigned URL for accessing a file
      parameters:
      - description: Filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get presigned file URL
      tags:
      - Storage
  /auth/login:
    put:
      consumes:
      - application/json
      description: API untuk login dengan email dan password
      parameters:
      - description: Login data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.ResponseParams-any'
      summary: Login
